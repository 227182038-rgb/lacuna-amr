# LACUNA-AMR — production stack (Phase 1, v0.5.0).
# One command from a clean checkout:
#   ./deploy/deploy.sh            (wraps everything below)
# Explicitly:
#   cp .env.example .env && $EDITOR .env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec app bun deploy/postgres/migrate-app-db.ts
#
# Services:
#   db      postgres:17 with a healthcheck, named volume, nightly backup job
#   app     the Next.js console (standalone) against Postgres
#   caddy   automatic HTTPS reverse proxy (staging/production)

name: lacuna-amr

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lacuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lacuna}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lacuna} -d ${POSTGRES_DB:-lacuna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not exposed publicly; the app talks to it on the compose network

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Prisma URL inside the compose network
      DATABASE_URL: postgresql://${POSTGRES_USER:-lacuna}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lacuna}?schema=public&connection_limit=20&pool_timeout=10
      # Billing provider: leave unset for sandbox mode; set for real Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Outbound integration secrets are per-organization, stored in the DB
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      LACUNA_DOMAIN: ${LACUNA_DOMAIN:?set LACUNA_DOMAIN in .env}
      LACUNA_ACME_EMAIL: ${LACUNA_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # nightly backup (02:17 UTC) + weekly restore drill (Sunday 03:41 UTC)
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lacuna}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-lacuna}
      BACKUP_DIR: /backups
    volumes:
      - ./postgres/backups:/backups
      - ./postgres/backup.sh:/usr/local/bin/backup.sh:ro
      - ./postgres/restore-drill.sh:/usr/local/bin/restore-drill.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date -u +%H%M)
          dow=$$(date -u +%w)
          if [ "$$now" = "0217" ]; then backup.sh; fi
          if [ "$$now" = "0341" ] && [ "$$dow" = "0" ]; then
            PGBIN=/usr/lib/postgresql/17/bin/ restore-drill.sh /backups/$$(ls -t /backups | head -1) || true
          fi
          sleep 60
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
