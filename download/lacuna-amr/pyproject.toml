[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna-amr"
version = "0.1.0"
description = "License-clean local auditing of genome-based antimicrobial-resistance predictions (research use only)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LACUNA-AMR project" }]
keywords = ["antimicrobial resistance", "audit", "conformal prediction", "genomics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.8"]

[project.scripts]
lacuna = "lacuna.cli:main"

[project.urls]
Homepage = "https://example.invalid/lacuna-amr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
